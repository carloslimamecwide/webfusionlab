name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production environment variables
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environmentName = "production";
            const requiredVariables = [
              "PROD_COMPOSE_PROJECT_NAME",
              "PROD_NGINX_HTTP_PORT",
              "PROD_NGINX_HTTPS_PORT",
              "PROD_NGINX_CERTS_PATH",
              "PROD_FRONTEND_SITE_URL",
              "PROD_FRONTEND_API_URL",
              "PROD_DB_NAME",
              "PROD_DB_USER",
              "PROD_SMTP_HOST",
              "PROD_SMTP_PORT",
              "PROD_SENDER_EMAIL",
              "PROD_SENDER_NAME",
              "PROD_CONTACT_ADMIN_EMAIL",
              "PROD_SEED_ADMIN",
            ];

            let response;
            try {
              response = await github.request(
                "GET /repos/{owner}/{repo}/environments/{environment_name}/variables",
                {
                  owner,
                  repo,
                  environment_name: environmentName,
                  per_page: 100,
                },
              );
            } catch (error) {
              core.setFailed(`Could not read environment variables for '${environmentName}': ${error.message}`);
              return;
            }

            const variables = new Map(
              response.data.variables.map((item) => [item.name, String(item.value ?? "").trim()]),
            );

            const missingVariables = requiredVariables.filter((name) => !variables.get(name));
            if (missingVariables.length > 0) {
              core.setFailed(
                `Missing required production variables: ${missingVariables.join(", ")}`,
              );
              return;
            }

            const seedAdmin = variables.get("PROD_SEED_ADMIN");
            if (seedAdmin !== "true" && seedAdmin !== "false") {
              core.setFailed("PROD_SEED_ADMIN must be explicitly set to 'true' or 'false'.");
              return;
            }

            if (seedAdmin === "true" && !variables.get("PROD_SEED_ADMIN_EMAIL")) {
              core.setFailed("Missing required production variable: PROD_SEED_ADMIN_EMAIL");
              return;
            }

            core.info("Production environment variables are present.");

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Prepare validation environment files
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          cp frontend/.env.production.example frontend/.env.production
          cp backend/.env.production.example backend/.env.production

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Validate frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Validate backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Run frontend tests
        run: npm run test --if-present
        working-directory: ./frontend

      - name: Run backend tests
        run: npm run test --if-present
        working-directory: ./backend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Build backend
        run: npm run build
        working-directory: ./backend

      - name: Validate docker compose configuration
        run: docker compose --env-file .env.production -f docker-compose.yml config > /dev/null

      - name: Validate production images build
        run: docker compose --env-file .env.production -f docker-compose.yml build nginx frontend backend
