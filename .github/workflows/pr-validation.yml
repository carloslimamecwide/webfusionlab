name: PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Prepare validation environment files
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production
          cp frontend/.env.production.example frontend/.env.production
          cp backend/.env.production.example backend/.env.production

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Validate frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Validate backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Run frontend tests
        run: npm run test --if-present
        working-directory: ./frontend

      - name: Run backend tests
        run: npm run test --if-present
        working-directory: ./backend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Build backend
        run: npm run build
        working-directory: ./backend

      - name: Validate docker compose configuration
        run: docker compose --env-file .env.production -f docker-compose.yml config > /dev/null

      - name: Validate production images build
        run: docker compose --env-file .env.production -f docker-compose.yml build nginx frontend backend
