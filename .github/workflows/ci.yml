name: CI — Build & Publish

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: carloslimamecwide

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_FRONTEND_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.webfusionlab.pt' }}
        run: npm run build

  publish-images:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Só publica imagens em push para main (não em PRs nem develop)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: echo "sha=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/webfusionlab-backend:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ env.OWNER }}/webfusionlab-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_FRONTEND_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.webfusionlab.pt' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/webfusionlab-frontend:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ env.OWNER }}/webfusionlab-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
