name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, Build and Deploy
    runs-on:
      - self-hosted
      - linux
      - production
    environment: production
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ${{ vars.PROD_COMPOSE_PROJECT_NAME || 'webfusionlab' }}
      NGINX_HTTP_PORT: ${{ vars.PROD_NGINX_HTTP_PORT || '80' }}
      NGINX_HTTPS_PORT: ${{ vars.PROD_NGINX_HTTPS_PORT || '443' }}
      NGINX_CERTS_PATH: ${{ vars.PROD_NGINX_CERTS_PATH || '/opt/webfusionlab/nginx-certs' }}
      FRONTEND_SITE_URL: ${{ vars.PROD_FRONTEND_SITE_URL || 'https://webfusionlab.pt' }}
      FRONTEND_API_URL: ${{ vars.PROD_FRONTEND_API_URL || 'https://api.webfusionlab.pt' }}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${{ vars.PROD_DB_NAME || 'webfusionlab' }}
      DB_USER: ${{ vars.PROD_DB_USER || 'webfusionlab' }}
      BACKEND_PORT: "3001"
      SMTP_HOST: ${{ vars.PROD_SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.PROD_SMTP_PORT || '587' }}
      SENDER_EMAIL: ${{ vars.PROD_SENDER_EMAIL || 'noreply@webfusionlab.pt' }}
      SENDER_NAME: ${{ vars.PROD_SENDER_NAME || 'WebFusionLab' }}
      CONTACT_ADMIN_EMAIL: ${{ vars.PROD_CONTACT_ADMIN_EMAIL || 'admin@webfusionlab.pt' }}
      SEED_ADMIN: ${{ vars.PROD_SEED_ADMIN || 'false' }}
      SEED_ADMIN_EMAIL: ${{ vars.PROD_SEED_ADMIN_EMAIL || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Generate production environment files
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          cat > .env.production <<EOF
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          NGINX_HTTP_PORT=${NGINX_HTTP_PORT}
          NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT}
          NGINX_CERTS_PATH=${NGINX_CERTS_PATH}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          EOF

          cat > frontend/.env.production <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_SITE_URL=${FRONTEND_SITE_URL}
          NEXT_PUBLIC_API_URL=${FRONTEND_API_URL}
          EOF

          cat > backend/.env.production <<EOF
          NODE_ENV=production
          PORT=${BACKEND_PORT}
          TRUST_PROXY=true
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${{ secrets.PROD_SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.PROD_SMTP_PASSWORD }}
          SENDER_EMAIL=${SENDER_EMAIL}
          SENDER_NAME=${SENDER_NAME}
          CONTACT_ADMIN_EMAIL=${CONTACT_ADMIN_EMAIL}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          ADMIN_REGISTRATION_TOKEN=${{ secrets.PROD_ADMIN_REGISTRATION_TOKEN }}
          SEED_ADMIN=${SEED_ADMIN}
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          SEED_ADMIN_PASSWORD=${{ secrets.PROD_SEED_ADMIN_PASSWORD }}
          EOF

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Validate frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Validate backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Run frontend tests
        run: npm run test --if-present
        working-directory: ./frontend

      - name: Run backend tests
        run: npm run test --if-present
        working-directory: ./backend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Build backend
        run: npm run build
        working-directory: ./backend

      - name: Validate docker compose configuration
        run: docker compose --env-file .env.production -f docker-compose.yml config > /dev/null

      - name: Build production containers
        run: docker compose --env-file .env.production -f docker-compose.yml build --pull nginx frontend backend

      - name: Deploy locally with Docker Compose
        run: docker compose --env-file .env.production -f docker-compose.yml up -d --remove-orphans --wait

      - name: Show running services
        run: docker compose --env-file .env.production -f docker-compose.yml ps

      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.yml logs --tail=200
