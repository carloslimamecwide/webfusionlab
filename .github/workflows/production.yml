name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, Build and Deploy
    runs-on:
      - self-hosted
      - linux
      - production
    environment: production
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ${{ vars.PROD_COMPOSE_PROJECT_NAME }}
      NGINX_HTTP_PORT: ${{ vars.PROD_NGINX_HTTP_PORT }}
      NGINX_HTTPS_PORT: ${{ vars.PROD_NGINX_HTTPS_PORT }}
      NGINX_CERTS_PATH: ${{ vars.PROD_NGINX_CERTS_PATH }}
      FRONTEND_SITE_URL: ${{ vars.PROD_FRONTEND_SITE_URL }}
      FRONTEND_API_URL: ${{ vars.PROD_FRONTEND_API_URL }}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${{ vars.PROD_DB_NAME }}
      DB_USER: ${{ vars.PROD_DB_USER }}
      BACKEND_PORT: "3001"
      SMTP_HOST: ${{ vars.PROD_SMTP_HOST }}
      SMTP_PORT: ${{ vars.PROD_SMTP_PORT }}
      SENDER_EMAIL: ${{ vars.PROD_SENDER_EMAIL }}
      SENDER_NAME: ${{ vars.PROD_SENDER_NAME }}
      CONTACT_ADMIN_EMAIL: ${{ vars.PROD_CONTACT_ADMIN_EMAIL }}
      SEED_ADMIN: ${{ vars.PROD_SEED_ADMIN }}
      SEED_ADMIN_EMAIL: ${{ vars.PROD_SEED_ADMIN_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Validate required production configuration
        shell: bash
        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          PROD_SMTP_PASSWORD: ${{ secrets.PROD_SMTP_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_ADMIN_REGISTRATION_TOKEN: ${{ secrets.PROD_ADMIN_REGISTRATION_TOKEN }}
          PROD_SEED_ADMIN_PASSWORD: ${{ secrets.PROD_SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          required_vars=(
            COMPOSE_PROJECT_NAME
            NGINX_HTTP_PORT
            NGINX_HTTPS_PORT
            NGINX_CERTS_PATH
            FRONTEND_SITE_URL
            FRONTEND_API_URL
            DB_NAME
            DB_USER
            SMTP_HOST
            SMTP_PORT
            SENDER_EMAIL
            SENDER_NAME
            CONTACT_ADMIN_EMAIL
            SEED_ADMIN
          )

          required_secrets=(
            PROD_DB_PASSWORD
            PROD_SMTP_USER
            PROD_SMTP_PASSWORD
            PROD_JWT_SECRET
            PROD_ADMIN_REGISTRATION_TOKEN
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production variable: ${name}"
              exit 1
            fi
          done

          for name in "${required_secrets[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production secret: ${name}"
              exit 1
            fi
          done

          if [ "${SEED_ADMIN}" != "true" ] && [ "${SEED_ADMIN}" != "false" ]; then
            echo "::error::SEED_ADMIN must be either 'true' or 'false'"
            exit 1
          fi

          if [ "${SEED_ADMIN}" = "true" ]; then
            if [ -z "${SEED_ADMIN_EMAIL:-}" ]; then
              echo "::error::Missing required production variable: SEED_ADMIN_EMAIL"
              exit 1
            fi

            if [ -z "${PROD_SEED_ADMIN_PASSWORD:-}" ]; then
              echo "::error::Missing required production secret: PROD_SEED_ADMIN_PASSWORD"
              exit 1
            fi
          fi

          if [ ! -f "${NGINX_CERTS_PATH}/origin.crt" ]; then
            echo "::error::Missing certificate file: ${NGINX_CERTS_PATH}/origin.crt"
            exit 1
          fi

          if [ ! -f "${NGINX_CERTS_PATH}/origin.key" ]; then
            echo "::error::Missing certificate file: ${NGINX_CERTS_PATH}/origin.key"
            exit 1
          fi

      - name: Generate production environment files
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          cat > .env.production <<EOF
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          NGINX_HTTP_PORT=${NGINX_HTTP_PORT}
          NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT}
          NGINX_CERTS_PATH=${NGINX_CERTS_PATH}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          EOF

          cat > frontend/.env.production <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_SITE_URL=${FRONTEND_SITE_URL}
          NEXT_PUBLIC_API_URL=${FRONTEND_API_URL}
          EOF

          cat > backend/.env.production <<EOF
          NODE_ENV=production
          PORT=${BACKEND_PORT}
          TRUST_PROXY=true
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${{ secrets.PROD_SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.PROD_SMTP_PASSWORD }}
          SENDER_EMAIL=${SENDER_EMAIL}
          SENDER_NAME=${SENDER_NAME}
          CONTACT_ADMIN_EMAIL=${CONTACT_ADMIN_EMAIL}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          ADMIN_REGISTRATION_TOKEN=${{ secrets.PROD_ADMIN_REGISTRATION_TOKEN }}
          SEED_ADMIN=${SEED_ADMIN}
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          SEED_ADMIN_PASSWORD=${{ secrets.PROD_SEED_ADMIN_PASSWORD }}
          EOF

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Validate frontend
        run: npm run lint
        working-directory: ./frontend

      - name: Validate backend
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Run frontend tests
        run: npm run test --if-present
        working-directory: ./frontend

      - name: Run backend tests
        run: npm run test --if-present
        working-directory: ./backend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Build backend
        run: npm run build
        working-directory: ./backend

      - name: Validate docker compose configuration
        run: docker compose --env-file .env.production -f docker-compose.yml config > /dev/null

      - name: Build production containers
        run: docker compose --env-file .env.production -f docker-compose.yml build --pull nginx frontend backend

      - name: Deploy locally with Docker Compose
        run: docker compose --env-file .env.production -f docker-compose.yml up -d --remove-orphans --wait

      - name: Show running services
        run: docker compose --env-file .env.production -f docker-compose.yml ps

      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.yml logs --tail=200
