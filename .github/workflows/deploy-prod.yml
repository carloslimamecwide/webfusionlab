name: Deploy — Production

on:
  # Dispara automaticamente quando o CI termina com sucesso em main
  workflow_run:
    workflows: ["CI — Build & Publish"]
    types: [completed]
    branches: [main]
  # Permite acionar manualmente via GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: read
    # Só avança se o CI teve sucesso (ou se foi acionado manualmente)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Write .env (temporário, limpo no final)
        run: |
          cat > deploy/.env <<'EOF'
          IMAGE_TAG=latest
          DB_USER=${{ vars.PROD_DB_USER || vars.DB_USER }}
          DB_NAME=${{ vars.PROD_DB_NAME || vars.DB_NAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD || secrets.DB_PASSWORD }}
          DB_HOST=postgres
          DB_PORT=5432
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET || secrets.JWT_SECRET }}
          SMTP_HOST=${{ vars.PROD_SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.PROD_SMTP_PORT || vars.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.PROD_SMTP_USER || secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.PROD_SMTP_PASSWORD || secrets.SMTP_PASSWORD }}
          CONTACT_ADMIN_EMAIL=${{ vars.PROD_CONTACT_ADMIN_EMAIL || 'admin@webfusionlab.pt' }}
          SENDER_NAME=${{ vars.PROD_SENDER_NAME || 'WebFusionLab' }}
          SENDER_EMAIL=${{ vars.PROD_SENDER_EMAIL || 'noreply@webfusionlab.pt' }}
          ADMIN_REGISTRATION_TOKEN=${{ secrets.PROD_ADMIN_REGISTRATION_TOKEN }}
          SEED_ADMIN=${{ vars.PROD_SEED_ADMIN || 'false' }}
          SEED_ADMIN_EMAIL=${{ vars.PROD_SEED_ADMIN_EMAIL || '' }}
          SEED_ADMIN_PASSWORD=${{ secrets.PROD_SEED_ADMIN_PASSWORD || '' }}
          EOF

      - name: Pull images from GHCR
        working-directory: deploy
        run: docker compose -f compose.prod.yml pull

      - name: Start / update containers
        working-directory: deploy
        run: docker compose -f compose.prod.yml up -d --remove-orphans

      - name: Remove .env temporário
        if: always()
        run: rm -f deploy/.env

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Verify containers are running
        run: |
          docker ps --filter "name=webfusionlab_" --format "table {{.Names}}\t{{.Status}}"
